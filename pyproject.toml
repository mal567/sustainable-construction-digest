[project]
name = "sustainable-construction-digest"
version = "0.1.0"
description = "Weekly sustainable construction news digest workflow running on Mistral Workflows, sent via Amazon SES"
requires-python = ">=3.11"
dependencies = [
    "mistralai-workflows>=3.10",
    "httpx>=0.27",
    "feedparser>=6.0.11",
    "markdown>=3.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/worker"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
